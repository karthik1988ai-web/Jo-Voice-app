name: Web app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web core tests
        run: node --test web/test/*.test.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Bridge function tests
        run: JO_BRIDGE_TEST=1 deno test --allow-env --allow-net supabase/functions/jo-bridge/

  # Publishes web/ to GitHub Pages. One-time: repo Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # GitHub sometimes lists a just-uploaded artifact only a few seconds later; without this
      # wait the deploy step fails with "No artifacts named github-pages were found".
      - name: Wait for the upload to register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
