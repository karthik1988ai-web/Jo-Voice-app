name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional fixed signing key so new builds install over old ones without losing settings.
      # Add repository secrets JO_KEYSTORE_BASE64 and JO_KEYSTORE_PASSWORD (see README).
      - name: Restore signing key
        env:
          JO_KEYSTORE_BASE64: ${{ secrets.JO_KEYSTORE_BASE64 }}
        if: env.JO_KEYSTORE_BASE64 != ''
        run: |
          echo "$JO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jo.keystore"
          echo "JO_KEYSTORE_FILE=$RUNNER_TEMP/jo.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          JO_KEYSTORE_PASSWORD: ${{ secrets.JO_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Jo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
