name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional fixed signing key so new builds install over old ones without losing settings.
      # Add repository secrets JO_KEYSTORE_BASE64 and JO_KEYSTORE_PASSWORD (see README).
      - name: Restore signing key
        env:
          JO_KEYSTORE_BASE64: ${{ secrets.JO_KEYSTORE_BASE64 }}
          JO_KEYSTORE_PASSWORD: ${{ secrets.JO_KEYSTORE_PASSWORD }}
        if: env.JO_KEYSTORE_BASE64 != ''
        run: |
          # Stray spaces or line breaks from copy and paste are ignored.
          printf '%s' "$JO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/jo.keystore"
          pw=$(printf '%s' "$JO_KEYSTORE_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$pw"
          if ! keytool -list -keystore "$RUNNER_TEMP/jo.keystore" -storepass "$pw" > /dev/null 2>&1; then
            echo "::error::The signing secrets don't match. Re-paste JO_KEYSTORE_PASSWORD and JO_KEYSTORE_BASE64 (only the value, nothing else) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "JO_KEYSTORE_FILE=$RUNNER_TEMP/jo.keystore" >> "$GITHUB_ENV"
          echo "JO_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./gradlew --no-daemon :phone:testDebugUnitTest :phone:assembleDebug
          cp phone/build/outputs/apk/debug/phone-debug.apk Jo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jo-apk
          path: Jo.apk
